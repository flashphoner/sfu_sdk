logging:
  file:
    name: logs/logs.log
  level:
    root: INFO
    com.flashphoner: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB
      file-name-pattern: logs/logs.%d{yyyy-MM-dd_HH}.%i.log.gz
      clean-history-on-start: false
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
