# CI/CD @flashphoner/sfusdk (SFU SDK) → версионируемые tar.gz/tgz в MinIO (bucket `builds`).
# Правки CI — на ИСТОЧНИКЕ (gitlab.flashphoner.com), затем зеркало в gitlab2 (wcs/sfu-sdk),
# где и запускается пайплайн. TeamCity (конфиг SFU-SDK-1.0, линия 2.0) не задет — он .gitlab-ci.yml
# не читает и продолжает публиковать в artifactory.
#
# Раскладка (общая для группы, как у server/billing/desktop/website):
#   wcs/sfu-sdk/releases/                — сборки из master
#   wcs/sfu-sdk/branches/<ветка>/        — сборки из веток
# Имена: sfu-sdk-2.0.<N>.tgz (npm pack) и sfu-sdk-2.0.<N>-examples.tar.gz + подвижные -2.0-latest.
# Номер <N> — общий счётчик: max(MinIO, TeamCity, Artifactory)+1, продолжает нумерацию TeamCity.
#
# CI-vars (gitlab2, проект wcs/sfu-sdk): MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY,
# TEAMCITY_USER/TEAMCITY_PASSWORD, ARTIFACTORY_USER/ARTIFACTORY_PASSWORD_B64.

include:
  - project: 'infra/ci-templates-k8s-stage'
    ref: main
    file: '/build-number.yml'
  - project: 'infra/ci-templates-k8s-stage'
    ref: main
    file: '/structure-test.yml'

stages:
  - prepare
  - package
  - test

variables:
  NPM_REGISTRY: "https://artifactory.flashphoner.com:4873/"
  MC_URL: "https://dl.min.io/client/mc/release/linux-amd64/mc"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

build-number:
  extends: .build-number
  variables:
    BUILD_PRODUCT: "sfu-sdk"
    BUILD_MINIO_PREFIX: "wcs/sfu-sdk"
    BUILD_LINE: "2.0"                     # линия версии пакета (package.json 2.0.x)
    ARTIFACTORY_PROJECT: "SFU-SDK"
    TC_MASTER_BUILDTYPES: "Sdk_Sfu_Version_10_SfuSdk10"   # id исторический, публикует линию 2.0
    TC_PRODUCT: "SFU-SDK"                 # веточные конфиги: "SFU-SDK | <ветка>"
    TC_ID_PREFIX: "Sdk_Sfu"
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Сборка библиотеки (tsc) + упаковка npm-пакета и примеров.
package-sdk:
  stage: package
  tags: [docker, stage]
  image: node:18
  needs:
    - job: build-number
      artifacts: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  script:
    # artifactory отдаёт leaf без интермедиата → strict-ssl off (как в остальных npm-сборках).
    - npm config set strict-ssl false
    - npm config set registry "$NPM_REGISTRY"
    # --ignore-scripts: postinstall тянет нативный wrtc (get-node-wrtc.sh), для tsc он не нужен.
    - npm ci --ignore-scripts --no-audit --no-fund
    # Версия пакета = номер сборки: он попадает и в имя tgz, и внутрь package.json.
    - |
      node -e '
        const f="package.json", p=require("./"+f);
        p.version=process.env.BUILD_VERSION;
        require("fs").writeFileSync(f, JSON.stringify(p,null,2)+"\n");
        console.log("package version =", p.version);
      '
    - npm run build
    - |
      set -e
      test -d dist || { echo "tsc не дал dist/"; exit 1; }
      npm pack                                   # → flashphoner-sfusdk-<version>.tgz
      mv flashphoner-sfusdk-*.tgz "sfu-sdk-${BUILD_VERSION}.tgz"
      tar czf "sfu-sdk-${BUILD_VERSION}-examples.tar.gz" -C examples .
      ls -lh sfu-sdk-${BUILD_VERSION}*
    - |
      set -e
      command -v mc >/dev/null 2>&1 || { curl -fsSL -o /usr/local/bin/mc "$MC_URL" && chmod +x /usr/local/bin/mc; }
      # у групповых MINIO_* бывает хвостовой пробел → mc: invalid port ":9000 "
      EP="$(printf %s "$MINIO_ENDPOINT" | tr -d '[:space:]')"
      AK="$(printf %s "$MINIO_ACCESS_KEY" | tr -d '[:space:]')"
      SK="$(printf %s "$MINIO_SECRET_KEY" | tr -d '[:space:]')"
      mc alias set m "$EP" "$AK" "$SK"
      D="builds/${BUILD_DEST}"
      mc cp "sfu-sdk-${BUILD_VERSION}.tgz"              "m/$D/"
      mc cp "sfu-sdk-${BUILD_VERSION}-examples.tar.gz"  "m/$D/"
      mc cp "sfu-sdk-${BUILD_VERSION}.tgz"              "m/$D/sfu-sdk-${BUILD_LINE}-latest.tgz"
      mc cp "sfu-sdk-${BUILD_VERSION}-examples.tar.gz"  "m/$D/sfu-sdk-${BUILD_LINE}-examples-latest.tar.gz"
      mc cp build-meta.json                             "m/$D/sfu-sdk-${BUILD_VERSION}.meta.json"
      echo "=== опубликовано в $D ==="; mc ls "m/$D/"
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Прогон сьюта SDK против эфемерной структуры (см. шаблон structure-test.yml). Заменяет шаг
# TeamCity, который поднимал compose-стенд из образов dockerhub:5000 и падал, если образа ветки
# и latest не оказалось: подбор «ветка карточки, иначе релиз» и досборку недостающего делает
# контрол-плейн структур. Структура живёт сутки после создания — упавший прогон есть где разобрать.
structure-test:
  extends: .structure-test
  image: node:18
  needs: []
  variables:
    ALLURE_LAUNCH_PREFIX: "SDK Test launch"
    ALLURE_LAUNCH_TAGS: "SDK Tests"
    ALLURE_RESULTS: "allure-results"
    # Стенд БЕЗ биллинга — как compose/docker-compose.yml этого репозитория (mongodb + minio +
    # zapp-server, биллинга нет). Под него написаны тесты, и в TeamCity они проходят именно так.
    # С биллингом zapp-node включает billing-клиент, а профиль в dev не создаётся (account/init
    # требует аутентификации, Keycloak в dev не настроен → 401), и сьют виснет на
    # «Billing profile is loading» — 59 broken в первом прогоне были именно этим.
    STRUCTURE_BILLING: "false"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  script:
    - !reference [.structure-test, script]
    - npm config set strict-ssl false
    - npm config set registry "$NPM_REGISTRY"
    # БЕЗ --ignore-scripts (в отличие от package-sdk): тестам нужен нативный wrtc.node,
    # его тянет postinstall → get-node-wrtc.sh.
    - npm ci --no-audit --no-fund
    # SFU_TEST_URL экспортирован шаблоном (wss://<хост структуры>/) — тесты идут на неё, а не на
    # локальный compose.
    # Репортёр и таймаут добавляем ФЛАГАМИ, а не в jest.config.js/package.json: конфиг общий с
    # TeamCity, и менять там что-либо ради структуры нельзя.
    #   --reporters=jest-allure2-reporter — пишет allure-results/, дальше их забирает allurectl.
    #     Взят именно РЕПОРТЁР, а не окружение allure-jest: последнее собирает результаты через
    #     handleTestEvent, а это circus-only API, и под jest-jasmine2 (он выставлен в jest.config.js)
    #     молча не пишет ничего. Переводить сьют на circus нельзя: 25 тестов написаны как
    #     `it(..., async (done) => {})`, что circus отвергает. Репортёры от runner'а не зависят.
    #   --testTimeout — стенд за ingress и TLS отвечает медленнее локального compose на петле,
    #     и тесты, укладывавшиеся в дефолтные 5с на агенте, здесь в них не влезают.
    - npm test -- --reporters=jest-allure2-reporter --testTimeout=30000
  after_script:
    # Вывод пишем и в файл: лог джобы обрезается лимитом раннера (4 МБ), а дампы упавших
    # jest-кейсов его выбирают целиком — без артефакта итог выгрузки просто не виден.
    - structure-ctl allure-upload 2>&1 | tee allure-upload.log || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - allure-results/
      - allure-upload.log
  rules:
    # Пайплайн из триггера (карточка ушла в PreVerification Todo) — запускаем сами: ручная джоба
    # в нём осталась бы неначатой, и триггер не делал бы ничего.
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      allow_failure: true
    # Обычный пуш — по кнопке: структура и возможная досборка образов стоят минут.
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
